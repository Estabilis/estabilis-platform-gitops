{{- /*
  Kyverno ClusterPolicies for every workload cluster.

  Opt-in toggle: components.kyverno-policies (flat boolean, mirrors
  platform-root convention).

  SINGLE SOURCE OF TRUTH. The chart in components/kyverno-policies is
  shared by both hub and workload clusters (ADR 0002 Phase 3). The
  values/workload/kyverno-policies.yaml overlay provides any workload-
  specific overrides.

  The rendered ApplicationSet uses a clusters generator keyed off
  .Values.clusterSelector.matchLabels — the same label the operator
  writes on ArgoCD Cluster Secrets when it registers a workload.

  Multi-source Application:
    1) This repo directly (path: components/kyverno-policies).
    2) This repo as $values — provides the base values and the
       workload overlay from values/workload/kyverno-policies.yaml.

  No managedNamespaceMetadata: the kyverno namespace is already created
  by the workload-kyverno ApplicationSet. Auto-sync with prune per
  ADR 0029 (Safe class — ClusterPolicy CRs only; pruning a removed
  policy = no enforcement; reversible by re-adding to the chart).
*/ -}}
{{- if index .Values.components "kyverno-policies" }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            {{- toYaml .Values.clusterSelector.matchLabels | nindent 12 }}
  template:
    metadata:
      name: "kyverno-policies-{{ `{{name}}` }}"
      annotations:
        argocd.argoproj.io/sync-wave: "3"
      labels:
        estabilis.io/workload-cluster: "{{ `{{name}}` }}"
    spec:
      project: workload-baseline
      sources:
        # 1) The chart itself, from this repo
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.repoVersion | quote }}
          path: components/kyverno-policies
          helm:
            releaseName: "kyverno-policies"
            valueFiles:
              - $values/components/kyverno-policies/values.yaml
              - $values/values/workload/kyverno-policies.yaml
              {{- include "workload-bootstrap.overrideValueFile" (dict "component" "kyverno-policies" "root" $) | nindent 14 }}
              {{- include "workload-bootstrap.gitopsValueFile" (dict "component" "kyverno-policies" "root" $) | nindent 14 }}
            {{- include "workload-bootstrap.ignoreMissingValueFiles" . | nindent 12 }}
            parameters:
              - name: global.environment
                value: {{ .Values.global.environment | quote }}
              {{- include "workload-bootstrap.provenanceParameters" $ | nindent 14 }}
        # 2) This repo as $values — overlay source
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.repoVersion | quote }}
          ref: values
        # 3) Client override repo (conditional — only when configRepoUrl is set)
        {{- include "workload-bootstrap.overrideSource" . | nindent 8 }}
        {{- include "workload-bootstrap.gitopsSource" . | nindent 8 }}
      destination:
        server: "{{ `{{server}}` }}"
        namespace: "kyverno"
      ignoreDifferences:
        - group: kyverno.io
          kind: ClusterPolicy
          # Ignore the fields Kyverno's admission controller mutates after apply
          # (admission, emitWarning, rules[].skipBackgroundRequests,
          # rules[].validate.allowExistingViolations) by FIELD MANAGER, not by
          # jqPathExpressions. jqPath expressions that target array items
          # (.spec.rules[]...) combined with RespectIgnoreDifferences pin the
          # whole .spec.rules array to the LIVE state, silently suppressing every
          # legitimate change to the rules (e.g. excluded-namespace-list edits) —
          # the policy then stays frozen at generation 1 and never updates.
          # managedFieldsManagers ignores exactly what the `kyverno` manager wrote
          # without pinning the array, so our own changes still apply.
          managedFieldsManagers:
            - kyverno
        # ADR 0005 L1 provenance annotations (built-at, build-id, etc.)
        # are handled globally via argocd-cm resource.customizations.ignoreDifferences.all
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
{{- end }}
