{{- /*
  Network policies for every workload cluster.

  Opt-in toggle: components.network-policies (flat boolean, mirrors
  platform-root convention).

  SINGLE SOURCE OF TRUTH. The chart in components/network-policies is
  shared by both hub and workload clusters (ADR 0002 Phase 2). The
  values/workload/network-policies.yaml overlay provides any workload-
  specific overrides (e.g. disabling platform-only namespaces).

  The rendered ApplicationSet uses a clusters generator keyed off
  .Values.clusterSelector.matchLabels — the same label the operator
  writes on ArgoCD Cluster Secrets when it registers a workload.

  Multi-source Application:
    1) This repo directly (path: components/network-policies).
    2) This repo as $values — provides the base values and the
       workload overlay from values/workload/network-policies.yaml.

  Destination namespace is "default" — NetworkPolicies are namespace-
  scoped but the chart creates them across multiple namespaces via
  metadata.namespace in each resource.
*/ -}}
{{- if ne (index .Values.components "network-policies") false }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: network-policies
  namespace: argocd
spec:
  # goTemplate required to read per-cluster bridge annotations (components.traefik*)
  # via `index .metadata.annotations`. missingkey=error is safe here: `index`
  # returns "" for absent keys (the option only guards `.field` access).
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            {{- toYaml .Values.clusterSelector.matchLabels | nindent 12 }}
  template:
    metadata:
      name: "network-policies-{{ `{{ .name }}` }}"
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      labels:
        estabilis.io/workload-cluster: "{{ `{{ .name }}` }}"
    spec:
      project: workload-baseline
      sources:
        # 1) The chart itself, from this repo
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.repoVersion | quote }}
          path: components/network-policies
          helm:
            releaseName: "network-policies"
            valueFiles:
              - $values/components/network-policies/values.yaml
              - $values/values/workload/network-policies.yaml
              {{- include "workload-bootstrap.overrideValueFile" (dict "component" "network-policies" "root" $) | nindent 14 }}
              {{- include "workload-bootstrap.gitopsValueFile" (dict "component" "network-policies" "root" $) | nindent 14 }}
            {{- include "workload-bootstrap.ignoreMissingValueFiles" . | nindent 12 }}
            parameters:
              - name: global.environment
                value: {{ .Values.global.environment | quote }}
              # Pass active components so the chart only creates policies
              # for namespaces that actually exist on this workload cluster.
              # The chart gates each policy on policies.{ns}.enabled AND
              # components.{ns} — both must be true for the policy to render.
              #
              # Active components from workload-bootstrap values (fleet-wide).
              # traefik / traefik-internal are intentionally SKIPPED here — they
              # are per-cluster (set below from the cluster's own bridge
              # annotations) so the traefik-ns policy only renders where ingress
              # is actually deployed on that cluster (ADR 0010).
              {{- range $name, $enabled := .Values.components }}
              {{- if not (has $name (list "traefik" "traefik-internal" "external-dns-internal")) }}
              - name: components.{{ $name }}
                value: {{ $enabled | quote }}
              {{- end }}
              {{- end }}
              # Per-cluster ingress gate. `default "false"` when the annotation is
              # absent keeps the chart's `!= "false"` gate OFF.
              - name: components.traefik
                value: '{{ `{{ index .metadata.annotations "estabilis.io/bridge.traefik-enabled" | default "false" }}` }}'
                forceString: true
              - name: components.traefik-internal
                value: '{{ `{{ index .metadata.annotations "estabilis.io/bridge.traefik-internal-enabled" | default "false" }}` }}'
                forceString: true
              # Per-cluster gate for the internal external-dns namespace (opt-in
              # via the operator label estabilis.io/addon.external-dns-internal,
              # sourced from the bridge key external-dns-internal-enabled). Gated
              # per-cluster — NOT fleet-wide — so the allow-external-dns-internal
              # NetworkPolicy only renders on clusters where the namespace exists.
              - name: components.external-dns-internal
                value: '{{ `{{ index .metadata.annotations "estabilis.io/bridge.external-dns-internal-enabled" | default "false" }}` }}'
                forceString: true
              # Explicitly disable components NOT in the workload baseline.
              # Without this, the chart's default (true) would create
              # policies for platform-only namespaces that don't exist.
              {{- $chartNamespaces := list "grafana" "argocd" "cert-manager" "external-secrets" "external-dns" "cnpg" "traefik" "velero" "opencost" "trivy" "kube-state-metrics" "node-exporter" "policy-reporter" }}
              {{- range $ns := $chartNamespaces }}
              {{- if not (hasKey $.Values.components $ns) }}
              - name: components.{{ $ns }}
                value: "false"
              {{- end }}
              {{- end }}
              {{- include "workload-bootstrap.provenanceParameters" $ | nindent 14 }}
        # 2) This repo as $values — overlay source
        - repoURL: {{ .Values.repoURL | quote }}
          targetRevision: {{ .Values.repoVersion | quote }}
          ref: values
        # 3) Client override repo (conditional — only when configRepoUrl is set)
        {{- include "workload-bootstrap.overrideSource" . | nindent 8 }}
        {{- include "workload-bootstrap.gitopsSource" . | nindent 8 }}
      destination:
        server: "{{ `{{ .server }}` }}"
        namespace: "default"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
{{- end }}
