# Platform overlay for network-policies.
# Hub Alloy lives in the grafana namespace (covered by allow-grafana).
# The allow-alloy policy targets namespace "alloy" which only exists on
# workload clusters — disable it on the hub.
#
# Same rationale for external-dns-internal: the second external-dns
# (azure-private-dns) and its namespace only exist on workload clusters,
# gated per-cluster by the operator label estabilis.io/addon.external-dns-internal.
# The hub never gets that namespace, so disable its allow policy here to
# avoid a NetworkPolicy targeting a non-existent namespace (App OutOfSync).
policies:
  alloy:
    enabled: false
  external-dns-internal:
    enabled: false
