# Workload overlay — cert-manager upstream chart values for workload clusters
# Note: commonLabels uses global.commonLabels (cert-manager chart quirk)
global:
  commonLabels:
    estabilis.io/managed-by: workload-bootstrap
    estabilis.io/component: cert-manager

installCRDs: true

# DNS-01 self-check via PUBLIC resolvers, not the cluster's (split-horizon) DNS.
# Internal hostnames under *.azure.<domain> resolve only via Azure Private DNS and
# have NO public A record (external-dns deliberately skips them). The ACME DNS-01
# challenge TXT is still created in the public Cloudflare zone, so cert-manager's
# propagation self-check must query public nameservers — otherwise it fails with
# "Could not determine authoritative nameservers for _acme-challenge.<host>.azure.…"
# and the certificate never issues (challenge stuck pending). Mirrors
# values/platform/cert-manager.yaml — the hub already does exactly this.
dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
dns01RecursiveNameserversOnly: true

replicaCount: 1

serviceAccount:
  create: true

prometheus:
  enabled: true
  servicemonitor:
    enabled: false

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

webhook:
  replicaCount: 1
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

cainjector:
  replicaCount: 1
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

startupapicheck:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
