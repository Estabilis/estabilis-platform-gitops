# Workload overlay — INTERNAL external-dns (Azure Private DNS) for workload
# clusters. Second external-dns instance, independent of the public Cloudflare
# one (values/workload/external-dns.yaml). Publishes A records for internal
# split-horizon hostnames (*.{cluster}.{internal_domain}) into the hub-owned
# Azure Private DNS zone, reading the Service's actual ILB IP (works for both
# fixed FortiGate-VIP and dynamic NAT-Gateway ILBs).
#
# Auth: Azure Workload Identity. The pod's ServiceAccount is federated to the
# managed identity created by estabilis-workload (mi-<base>-external-dns-int),
# which holds "Private DNS Zone Contributor" on the zone. tenantId,
# subscriptionId, resourceGroup and the SA client-id annotation are injected
# per-cluster as helm parameters from the cluster bridge annotations (see
# workload-bootstrap/templates/external-dns-internal.yaml).
# Pin the image by digest (manifest-list / multi-arch). The chart's image
# helper renders `repository:tag`, and `tag: "vX.Y.Z@sha256:..."` produces the
# valid OCI reference `repository:vX.Y.Z@sha256:...` — digest-pinned and
# satisfying the require-image-digest Kyverno policy. Digest is the multi-arch
# index for v0.20.0 (amd64/arm64/arm-v7), so it resolves on any node arch.
# When bumping the chart's appVersion, refresh this digest too.
image:
  tag: "v0.20.0@sha256:ddc7f4212ed09a21024deb1f470a05240837712e74e4b9f6d1f2632ff10672e7"

provider:
  name: azure-private-dns

# Only Ingress: internal hostnames come from the exposure Ingresses (ADR 0014).
# (Service is left out to avoid publishing internal LB Service IPs under
# unintended names; Ingress carries the intended host.)
sources:
  - ingress

policy: sync
registry: txt

# Azure cloud config. The kubernetes-sigs external-dns chart does NOT consume a
# top-level `azure:` block (that is a Bitnami-chart feature) — it provisions the
# /etc/kubernetes/azure.json the azure-private-dns provider reads via
# `secretConfiguration`. The file content (tenantId / subscriptionId /
# resourceGroup + useWorkloadIdentityExtension) is injected per-cluster by the
# ApplicationSet as the `secretConfiguration.data.azure\.json` parameter from
# the cluster bridge annotations. With useWorkloadIdentityExtension the pod's
# federated SA token (azure.workload.identity/use label + client-id annotation)
# supplies the identity — no client secret in the file.
secretConfiguration:
  enabled: true
  mountPath: /etc/kubernetes
  data: {}

serviceAccount:
  create: true
  name: external-dns-internal

# Workload Identity: label required on the pod so the webhook injects the
# projected token; the client-id annotation on the SA is set per-cluster.
podLabels:
  azure.workload.identity/use: "true"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
