# cluster-secret-store — ExternalSecrets ClusterSecretStore.
#
# Provider selection (v0.34.0+):
#   - provider: azure  (default, backward-compatible)  → uses Azure Key Vault
#   - provider: aws                                    → uses AWS Secrets Manager
#   - provider: gcpsm                                  → uses GCP Secret Manager
#
# `provider` names the SECRET BACKEND, not the cloud the cluster runs on. A
# DigitalOcean cluster reading from Google Secret Manager sets `gcpsm`; that
# case is why the value is not a cloud name.
#
# Azure + AWS share the same multi-store semantics; each provider reads
# a provider-specific subset of fields. When `stores` is empty the
# chart renders a single legacy `platform-secret-store` with top-level
# fields.

provider: azure

# --------------------- Azure provider ---------------------------------
#
# Required when provider=azure.
#
# Single-store: top-level `vaultUrl` + `tenantId`.
# Multi-store: `stores` with per-entry `vaultUrl` + (optional) `tenantId`
# (falls back to top-level tenantId).

vaultUrl: ""
tenantId: ""

# --------------------- AWS provider -----------------------------------
#
# Required when provider=aws.
#
# Single-store: top-level `region` used as the AWS region for Secrets
# Manager.
# Multi-store: `stores` entries may override `region` per-entry; fall
# back to top-level `region`.
#
# `aws.serviceAccount.{name,namespace}` reference the external-secrets
# controller ServiceAccount annotated with an IRSA role ARN (wired by
# Terraform; see providers/aws/iam.tf → module.external_secrets_irsa).

region: ""

aws:
  serviceAccount:
    name: external-secrets
    namespace: external-secrets

# --------------------- GCP Secret Manager provider --------------------
#
# Required when provider=gcpsm.
#
# Authentication is Workload Identity Federation, NOT `workloadIdentity`.
# The latter is GKE-only — it reads cluster metadata from the GCE metadata
# server, which a non-Google node does not have. Federation is what ESO
# documents for "AKS, EKS, self-hosted clusters, and OpenShift", and it needs
# no key: ESO exchanges a bound Kubernetes ServiceAccount token for a Google
# access token.
#
# THE TWO AUDIENCES ARE DIFFERENT VALUES, and swapping them fails at the
# token exchange rather than at render:
#
#   gcpsm.audience
#     The STS audience, in the `//iam.googleapis.com/projects/<NUMBER>/
#     locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>`
#     form.
#
#   gcpsm.serviceAccount.audiences
#     The `aud` claim the projected Kubernetes token carries. Google requires
#     the `https://iam.googleapis.com/...` form when the pool provider sets no
#     allowedAudiences. Leave empty only if the provider was configured to
#     accept something else.
#
# gcpServiceAccountEmail makes ESO impersonate a Google service account after
# federating, so reads are authorised by THAT account's IAM bindings —
# typically roles/secretmanager.secretAccessor scoped to one secret. Optional;
# left empty, the federated principal must hold the permission itself.
#
# NOT CONFIGURABLE HERE, and it will refuse the exchange on its own: the pool
# provider's attributeCondition must admit the `sub` of the ServiceAccount
# below. That is Terraform's side, and it is evaluated before IAM.

gcpsm:
  projectID: ""
  audience: ""
  gcpServiceAccountEmail: ""

  # ESO's OWN ServiceAccount. The operator's mounted token cannot be used as
  # the subject token — the upstream API documents that explicitly — so this
  # must name the controller's account, not a per-workload one.
  serviceAccount:
    name: external-secrets
    namespace: external-secrets
    audiences: []

# ---------------------- Multi-store list ------------------------------
#
# Each entry:
#   - name: ClusterSecretStore resource name (must be unique cluster-wide)
#   - vaultUrl: (azure only) https://<kvname>.vault.azure.net/
#   - tenantId: (azure only, optional) falls back to top-level `tenantId`
#   - region:   (aws only, optional) falls back to top-level `region`
#   - projectID / audience / gcpServiceAccountEmail:
#               (gcpsm only, optional) fall back to the `gcpsm` block
#
# Example (Azure):
#
# stores:
#   - name: platform-secret-store
#     vaultUrl: https://kv-transfero-hml-lmj060.vault.azure.net/
#   - name: shared-infra-secret-store
#     vaultUrl: https://kv-transfero-shared-infra-hml-xxxxx.vault.azure.net/
#
# Example (AWS):
#
# stores:
#   - name: platform-secret-store
#     region: us-east-1
stores: []

# ---------------------- Vault provider --------------------------------
#
# OPT-IN. When `vault.enabled: true`, the chart renders a Vault-backed
# `app-secret-store` ClusterSecretStore IN ADDITION to the AWS or Azure
# `platform-secret-store` rendered by the provider templates above.
#
# Default off — most deployments don't run Vault. Activated by passing
# `vault.enabled=true` from platform-root, which it does only when
# `components.vault: true` in the platform-root values (the same
# toggle that activates the Vault Application itself, so this store
# is always in sync with whether Vault is actually deployed).
#
# Why a separate store (not just provider=vault)?
#   - `platform-secret-store` (AWS SM / Azure KV) holds platform secrets
#     bootstrapped by Terraform (grafana-db, argocd-redis, opencost,
#     openai-api-key, etc).
#   - `app-secret-store` (Vault) holds workload application secrets
#     curated by the platform team out-of-band.
#   - Two stores let apps choose where their secrets live without
#     mixing scopes. The cortex `common-app` chart hardcodes
#     `storeName: app-secret-store` as the canonical name.
#
# Defaults assume Vault is deployed in-cluster at the standard service
# URL produced by the HashiCorp Vault chart, with kubernetes auth
# enabled and a role named `external-secrets` that has the `eso` policy
# (vault-bootstrap.sh provisions both).

vault:
  enabled: false

  # ClusterSecretStore name. The cortex common-app chart expects
  # `app-secret-store`. Change only if your fleet uses a different
  # canonical name.
  storeName: "app-secret-store"

  # Vault address. Default works for in-cluster Vault deployed via
  # the HashiCorp chart in the `vault` namespace.
  server: "http://vault.vault.svc.cluster.local:8200"

  # KV mount path + version. The vault-bootstrap.sh script enables
  # KV-v2 at `secret/`.
  path: "secret"
  version: "v2"

  # Auth via Vault's kubernetes auth method.
  auth:
    kubernetes:
      mountPath: "kubernetes"
      role: "external-secrets"
      serviceAccount:
        name: "external-secrets"
        namespace: "external-secrets"
