{{- /*
  ClusterSecretStore renderer (GCP Secret Manager branch).

  Uses External Secrets Operator's `gcpsm` provider. Reached with
  `provider: gcpsm`, which names the SECRET BACKEND, not the cloud the
  cluster runs on — the same way `aws` here means Secrets Manager and
  `azure` means Key Vault. A DigitalOcean cluster reading from Google
  Secret Manager is the case this was written for, and it is why the
  value is `gcpsm` rather than a cloud name.

  WHY THIS EXISTS

    DigitalOcean has no managed secret store. Vault is the platform's
    intended one, but it arrives at wave 6, and cert-manager needs its
    DNS-01 token at wave 2 — so a store has to exist before Vault does
    or the token travels in cleartext on an Application spec. This is
    that store.

  AUTHENTICATION — federation, and no key anywhere

    `workloadIdentityFederation`, not `workloadIdentity`. The latter is
    GKE-only: it reads cluster metadata from the GCE metadata server,
    which does not exist on a node that is not Google's. Federation is
    what ESO documents for "AKS, EKS, self-hosted clusters, and
    OpenShift".

    Three things have to agree, and two of them are not in this chart:

      1. `serviceAccountRef` — ESO asks the API server for a bound token
         for this ServiceAccount. It must be ESO's OWN ServiceAccount:
         the operator's mounted token cannot be used as the subject
         token, which the upstream API documents explicitly.

      2. `audience` — the STS audience, in the `//iam.googleapis.com/...`
         form. `serviceAccountRef.audiences` is a DIFFERENT value: the
         `aud` claim the projected Kubernetes token carries, which
         Google requires in the `https://iam.googleapis.com/...` form
         when the provider sets no `allowedAudiences`. Passing one where
         the other belongs fails at the exchange, not at render.

      3. The pool provider's `attributeCondition` must admit this
         ServiceAccount's `sub`. That is Terraform's side, it is
         evaluated BEFORE IAM, and a subject missing from it is refused
         even when every binding it needs exists.

  IMPERSONATION

    `gcpServiceAccountEmail` makes ESO impersonate a Google service
    account after federating, so access is granted through THAT
    account's bindings — `roles/secretmanager.secretAccessor`, scoped to
    a single secret — rather than on the federated principal directly.
    One stable member to write IAM against, and the grant survives the
    cluster being rebuilt.

    Optional. Left empty, the federated principal must hold the read
    permission itself.

  Two modes, mirroring the aws and azure branches: `.Values.stores`
  empty renders the single `platform-secret-store`; a non-empty list
  renders one store per entry, each able to override `projectID`.
*/ -}}
{{- $provider := .Values.provider | default "azure" -}}
{{- if eq $provider "gcpsm" -}}
{{- $g := .Values.gcpsm | default dict -}}
{{- $saName := (dig "serviceAccount" "name" "external-secrets" $g) -}}
{{- $saNamespace := (dig "serviceAccount" "namespace" "external-secrets" $g) -}}
{{- $saAudiences := (dig "serviceAccount" "audiences" (list) $g) -}}
{{- $audience := required "gcpsm.audience is required when provider=gcpsm" (dig "audience" "" $g) -}}
{{- $gcpServiceAccount := (dig "gcpServiceAccountEmail" "" $g) -}}
{{- $stores := .Values.stores | default list -}}
{{- if eq (len $stores) 0 -}}
{{- /* Legacy single-store fallback, same name the other providers use. */ -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-secret-store
spec:
  provider:
    gcpsm:
      projectID: {{ required "gcpsm.projectID is required when provider=gcpsm" (dig "projectID" "" $g) | quote }}
      auth:
        workloadIdentityFederation:
          audience: {{ $audience | quote }}
          {{- if $gcpServiceAccount }}
          gcpServiceAccountEmail: {{ $gcpServiceAccount | quote }}
          {{- end }}
          serviceAccountRef:
            name: {{ $saName | quote }}
            namespace: {{ $saNamespace | quote }}
            {{- if $saAudiences }}
            audiences:
              {{- range $saAudiences }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
{{- else -}}
{{- range $i, $s := $stores }}
{{- if gt $i 0 }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ required "stores[].name is required" $s.name | quote }}
spec:
  provider:
    gcpsm:
      projectID: {{ (($s.projectID | default (dig "projectID" "" $g)) | required "stores[].projectID or gcpsm.projectID is required when provider=gcpsm") | quote }}
      auth:
        workloadIdentityFederation:
          audience: {{ (($s.audience | default $audience) | required "stores[].audience or gcpsm.audience is required when provider=gcpsm") | quote }}
          {{- $sa := ($s.gcpServiceAccountEmail | default $gcpServiceAccount) }}
          {{- if $sa }}
          gcpServiceAccountEmail: {{ $sa | quote }}
          {{- end }}
          serviceAccountRef:
            name: {{ $saName | quote }}
            namespace: {{ $saNamespace | quote }}
            {{- if $saAudiences }}
            audiences:
              {{- range $saAudiences }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
